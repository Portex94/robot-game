services:
  web:
    image: nginx:alpine
    restart: on-failure
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
